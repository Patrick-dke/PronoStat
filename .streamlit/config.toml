[theme]
base = "dark"
primaryColor = "#D9B45B"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#141B24"
textColor = "#E8EDF4"
font = "sans serif"

[server]
headless = true
# Faux volontairement : en ligne, le rechargement automatique peut se
# déclencher en boucle si l'application écrit son cache dans son propre
# dossier. En local, appuyez sur « R » pour recharger après une modification.
runOnSave = false

[browser]
gatherUsageStats = false
